<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E"/>
      <stop offset="50%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- OPTION C: Geometric Minimal -->
  <text x="150" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#888" letter-spacing="2">OPTION C</text>
  
  <!-- Hexagon frame -->
  <polygon points="50,20 80,35 80,75 50,90 20,75 20,35" fill="none" stroke="url(#gC)" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner triangle -->
  <polygon points="50,30 75,70 25,70" fill="none" stroke="url(#gC)" stroke-width="1" opacity="0.3"/>
  
  <!-- ST -->
  <text x="50" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="url(#gC)">ST</text>
  
  <!-- Dot accents -->
  <circle cx="50" cy="20" r="3" fill="#D4A853"/>
  <circle cx="80" cy="75" r="2" fill="#D4A853" opacity="0.6"/>
  <circle cx="20" cy="75" r="2" fill="#D4A853" opacity="0.6"/>
  
  <!-- Wordmark -->
  <text x="110" y="60" font-family="Georgia, serif" font-size="22" fill="#D4A853" letter-spacing="1">Numerology</text>
</svg>
