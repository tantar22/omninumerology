<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Lotus petals -->
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(0 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(45 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(90 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(135 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(180 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(225 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(270 40 40)"/>
  <ellipse cx="40" cy="24" rx="4" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.35" transform="rotate(315 40 40)"/>
  
  <!-- Center -->
  <circle cx="40" cy="40" r="12" fill="#0A0B10" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="40" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="url(#goldGrad)">ST</text>

  <!-- Wordmark -->
  <text x="80" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#D4A853" letter-spacing="0.5">Numerology</text>
</svg>
