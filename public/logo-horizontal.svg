<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(5,5)">
    <!-- Flower of Life (mini) -->
    <g opacity="0.2" stroke="url(#goldGrad)" stroke-width="0.6" fill="none">
      <circle cx="45" cy="45" r="12"/>
      <circle cx="45" cy="35" r="12"/>
      <circle cx="54" cy="40" r="12"/>
      <circle cx="54" cy="50" r="12"/>
      <circle cx="45" cy="55" r="12"/>
      <circle cx="36" cy="50" r="12"/>
      <circle cx="36" cy="40" r="12"/>
    </g>

    <!-- Lotus petals -->
    <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(45 45 45)"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(90 45 45)"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(135 45 45)"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(180 45 45)"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(225 45 45)"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(270 45 45)"/>
      <path d="M45,15 Q50,30 45,42 Q40,30 45,15" transform="rotate(315 45 45)"/>
    </g>

    <!-- Center -->
    <circle cx="45" cy="45" r="12" fill="#0A0B10" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="45" cy="45" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="110" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#D4A853" letter-spacing="0.5">Numerology</text>
</svg>
