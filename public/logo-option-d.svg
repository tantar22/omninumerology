  <circle cx="33" cy="45" r="20" fill="none" stroke="url(#gD)" stroke-width="1" opacity="0.3"/>
  <circle cx="67" cy="45" r="20" fill="none" stroke="url(#gD)" stroke-width="1" opacity="0.3"/>
