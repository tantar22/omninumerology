<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Mini flower of life -->
  <g opacity="0.2" stroke="url(#g)" stroke-width="0.5" fill="none">
    <circle cx="16" cy="16" r="5"/>
    <circle cx="16" cy="12" r="5"/>
    <circle cx="19.5" cy="14" r="5"/>
    <circle cx="19.5" cy="18" r="5"/>
    <circle cx="16" cy="20" r="5"/>
    <circle cx="12.5" cy="18" r="5"/>
    <circle cx="12.5" cy="14" r="5"/>
  </g>

  <!-- Lotus petals -->
  <g stroke="url(#g)" stroke-width="1" fill="none">
    <path d="M16,4 Q18.5,10 16,14 Q13.5,10 16,4"/>
    <path d="M16,4 Q18.5,10 16,14 Q13.5,10 16,4" transform="rotate(90 16 16)"/>
    <path d="M16,4 Q18.5,10 16,14 Q13.5,10 16,4" transform="rotate(180 16 16)"/>
    <path d="M16,4 Q18.5,10 16,14 Q13.5,10 16,4" transform="rotate(270 16 16)"/>
  </g>

  <!-- Center -->
  <circle cx="16" cy="16" r="5" fill="#0A0B10" stroke="url(#g)" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="1.5" fill="url(#g)"/>
</svg>
