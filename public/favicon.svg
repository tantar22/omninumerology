<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.5"/>
  
  <!-- Mini petals -->
  <ellipse cx="16" cy="8" rx="2" ry="5" fill="none" stroke="url(#g)" stroke-width="0.6" opacity="0.4" transform="rotate(0 16 16)"/>
  <ellipse cx="16" cy="8" rx="2" ry="5" fill="none" stroke="url(#g)" stroke-width="0.6" opacity="0.4" transform="rotate(90 16 16)"/>
  <ellipse cx="16" cy="8" rx="2" ry="5" fill="none" stroke="url(#g)" stroke-width="0.6" opacity="0.4" transform="rotate(180 16 16)"/>
  <ellipse cx="16" cy="8" rx="2" ry="5" fill="none" stroke="url(#g)" stroke-width="0.6" opacity="0.4" transform="rotate(270 16 16)"/>
  
  <!-- Center -->
  <circle cx="16" cy="16" r="6" fill="#0A0B10" stroke="url(#g)" stroke-width="1"/>
  <text x="16" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="700" fill="url(#g)">ST</text>
</svg>
