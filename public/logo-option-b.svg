<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E"/>
      <stop offset="50%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- OPTION B: Lotus Mandala -->
  <text x="150" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#888" letter-spacing="2">OPTION B</text>
  
  <!-- Lotus petals (8 petals) -->
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(0 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(45 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(90 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(135 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(180 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(225 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(270 50 55)"/>
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="none" stroke="url(#gB)" stroke-width="1" opacity="0.4" transform="rotate(315 50 55)"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="55" r="16" fill="#0A0B10" stroke="url(#gB)" stroke-width="1.5"/>
  
  <!-- ST -->
  <text x="50" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="url(#gB)">ST</text>
  
  <!-- Wordmark -->
  <text x="110" y="60" font-family="Georgia, serif" font-size="22" fill="#D4A853" letter-spacing="1">Numerology</text>
</svg>
