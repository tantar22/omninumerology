<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- 4 cardinal dots -->
  <circle cx="24" cy="4" r="1.5" fill="#D4A853" opacity="0.6"/>
  <circle cx="44" cy="24" r="1.5" fill="#D4A853" opacity="0.6"/>
  <circle cx="24" cy="44" r="1.5" fill="#D4A853" opacity="0.6"/>
  <circle cx="4" cy="24" r="1.5" fill="#D4A853" opacity="0.6"/>

  <!-- ST Letters -->
  <text x="24" y="29" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="url(#goldGrad)" letter-spacing="-0.5">ST</text>
</svg>
