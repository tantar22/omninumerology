<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Flower of Life (simplified) -->
  <g opacity="0.25" stroke="url(#goldGrad)" stroke-width="0.8" fill="none">
    <circle cx="40" cy="40" r="10"/>
    <circle cx="40" cy="30" r="10"/>
    <circle cx="49" cy="35" r="10"/>
    <circle cx="49" cy="45" r="10"/>
    <circle cx="40" cy="50" r="10"/>
    <circle cx="31" cy="45" r="10"/>
    <circle cx="31" cy="35" r="10"/>
  </g>

  <!-- Lotus petals -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" fill="none">
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(45 40 40)"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(90 40 40)"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(135 40 40)"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(180 40 40)"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(225 40 40)"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(270 40 40)"/>
    <path d="M40,12 Q47,28 40,38 Q33,28 40,12" transform="rotate(315 40 40)"/>
  </g>

  <!-- Center -->
  <circle cx="40" cy="40" r="10" fill="#0A0B10" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="40" cy="40" r="3" fill="url(#goldGrad)"/>
</svg>
