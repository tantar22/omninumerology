<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="30" cy="30" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Lotus petals (8) -->
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(0 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(45 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(90 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(135 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(180 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(225 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(270 30 30)"/>
  <ellipse cx="30" cy="18" rx="3" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" transform="rotate(315 30 30)"/>

  <!-- Center circle -->
  <circle cx="30" cy="30" r="10" fill="#0A0B10" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- 4 dots -->
  <circle cx="30" cy="5" r="1.2" fill="#D4A853" opacity="0.6"/>
  <circle cx="55" cy="30" r="1.2" fill="#D4A853" opacity="0.6"/>
  <circle cx="30" cy="55" r="1.2" fill="#D4A853" opacity="0.6"/>
  <circle cx="5" cy="30" r="1.2" fill="#D4A853" opacity="0.6"/>

  <!-- ST -->
  <text x="30" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="url(#goldGrad)">ST</text>
</svg>
