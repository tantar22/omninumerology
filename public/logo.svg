<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <clipPath id="lotusClip">
      <path d="M200,40 C220,80 260,100 280,140 C300,180 280,220 260,240 C240,260 220,280 200,300 C180,280 160,260 140,240 C120,220 100,180 120,140 C140,100 180,80 200,40 Z"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.2"/>

  <!-- Flower of Life pattern (from D) - dense overlapping circles -->
  <g opacity="0.3" stroke="url(#goldGrad)" stroke-width="1.2" fill="none">
    <!-- Center circle -->
    <circle cx="200" cy="200" r="35"/>
    <!-- First ring -->
    <circle cx="200" cy="165" r="35"/>
    <circle cx="230" cy="182" r="35"/>
    <circle cx="230" cy="218" r="35"/>
    <circle cx="200" cy="235" r="35"/>
    <circle cx="170" cy="218" r="35"/>
    <circle cx="170" cy="182" r="35"/>
    <!-- Second ring -->
    <circle cx="200" cy="130" r="35"/>
    <circle cx="230" cy="147" r="35"/>
    <circle cx="260" cy="165" r="35"/>
    <circle cx="260" cy="200" r="35"/>
    <circle cx="260" cy="235" r="35"/>
    <circle cx="230" cy="253" r="35"/>
    <circle cx="200" cy="270" r="35"/>
    <circle cx="170" cy="253" r="35"/>
    <circle cx="140" cy="235" r="35"/>
    <circle cx="140" cy="200" r="35"/>
    <circle cx="140" cy="165" r="35"/>
    <circle cx="170" cy="147" r="35"/>
    <!-- Third ring (partial) -->
    <circle cx="200" cy="95" r="35"/>
    <circle cx="245" cy="115" r="35"/>
    <circle cx="275" cy="147" r="35"/>
    <circle cx="290" cy="182" r="35"/>
    <circle cx="290" cy="218" r="35"/>
    <circle cx="275" cy="253" r="35"/>
    <circle cx="245" cy="285" r="35"/>
    <circle cx="200" cy="305" r="35"/>
    <circle cx="155" cy="285" r="35"/>
    <circle cx="125" cy="253" r="35"/>
    <circle cx="110" cy="218" r="35"/>
    <circle cx="110" cy="182" r="35"/>
    <circle cx="125" cy="147" r="35"/>
    <circle cx="155" cy="115" r="35"/>
  </g>

  <!-- Lotus Petals - Bold outer layer (from B) -->
  <g stroke="url(#goldGrad)" stroke-width="3" fill="none">
    <!-- 8 large pointed petals -->
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(45 200 200)"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(90 200 200)"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(135 200 200)"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(180 200 200)"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(225 200 200)"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(270 200 200)"/>
    <path d="M200,50 Q220,120 200,170 Q180,120 200,50" opacity="0.9" transform="rotate(315 200 200)"/>
  </g>

  <!-- Inner petals - smaller, rotated 22.5deg -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(45 200 200)"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(90 200 200)"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(135 200 200)"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(180 200 200)"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(225 200 200)"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(270 200 200)"/>
    <path d="M200,85 Q212,130 200,165 Q188,130 200,85" transform="rotate(315 200 200)"/>
  </g>

  <!-- Center circle with dot (from B) -->
  <circle cx="200" cy="200" r="30" fill="#0A0B10" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="200" cy="200" r="8" fill="url(#goldGrad)"/>

  <!-- ST Letters -->
  <text x="200" y="208" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" letter-spacing="-1">ST</text>
</svg>
