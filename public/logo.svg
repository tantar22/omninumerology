<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D98E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4A853;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#D4A853;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Outer circle - numerology wheel -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Sacred Geometry: Flower of Life circles (outer ring) -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>
  <circle cx="150" cy="90" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>
  <circle cx="150" cy="210" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>
  <circle cx="98" cy="120" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>
  <circle cx="202" cy="120" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>
  <circle cx="98" cy="180" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>
  <circle cx="202" cy="180" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.15"/>

  <!-- Lotus Petals (8 petals) - from Option B -->
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(0 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(45 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(90 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(135 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(180 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(225 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(270 150 150)"/>
  <ellipse cx="150" cy="105" rx="12" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35" transform="rotate(315 150 150)"/>

  <!-- Inner petals (smaller, rotated 22.5deg) -->
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(22.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(67.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(112.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(157.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(202.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(247.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(292.5 150 150)"/>
  <ellipse cx="150" cy="118" rx="8" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(337.5 150 150)"/>

  <!-- Center glow -->
  <circle cx="150" cy="150" r="45" fill="url(#centerGlow)"/>

  <!-- Center circle -->
  <circle cx="150" cy="150" r="38" fill="#0A0B10" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- 8 small dots on circle edge -->
  <circle cx="150" cy="112" r="2" fill="#D4A853" opacity="0.7"/>
  <circle cx="177" cy="123" r="1.5" fill="#D4A853" opacity="0.5"/>
  <circle cx="188" cy="150" r="2" fill="#D4A853" opacity="0.7"/>
  <circle cx="177" cy="177" r="1.5" fill="#D4A853" opacity="0.5"/>
  <circle cx="150" cy="188" r="2" fill="#D4A853" opacity="0.7"/>
  <circle cx="123" cy="177" r="1.5" fill="#D4A853" opacity="0.5"/>
  <circle cx="112" cy="150" r="2" fill="#D4A853" opacity="0.7"/>
  <circle cx="123" cy="123" r="1.5" fill="#D4A853" opacity="0.5"/>

  <!-- ST Letters -->
  <text x="150" y="162" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="url(#goldGrad)" letter-spacing="-1">ST</text>

  <!-- Subtle inner glow on text -->
  <text x="150" y="162" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#FFF8DC" letter-spacing="-1" opacity="0.08">ST</text>
</svg>
